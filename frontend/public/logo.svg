<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!--
    Islamic 8-pointed star (khatam) — center (32,32), outer R=26, inner r=12
    16 alternating points calculated at 22.5° intervals starting from top (−90°)
  -->
  <polygon
    points="
      32,6
      36.6,20.9
      50.4,13.6
      43.1,27.4
      58,32
      43.1,36.6
      50.4,50.4
      36.6,43.1
      32,58
      27.4,43.1
      13.6,50.4
      20.9,36.6
      6,32
      20.9,27.4
      13.6,13.6
      27.4,20.9
    "
    fill="url(#g1)"
  />

  <!-- Inner octagon highlight (connects the 8 inner points) -->
  <polygon
    points="36.6,20.9 43.1,27.4 43.1,36.6 36.6,43.1 27.4,43.1 20.9,36.6 20.9,27.4 27.4,20.9"
    fill="url(#g2)"
    opacity="0.6"
  />

  <!-- Center jewel -->
  <circle cx="32" cy="32" r="6" fill="#fef3c7" opacity="0.85"/>

  <!-- Wordmark — Georgia serif for elegance -->
  <text
    x="74"
    y="43"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="700"
    letter-spacing="0.5"
    fill="white"
  >Munazara</text>
</svg>
